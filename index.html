<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d2329; --mute:#66707a; --line:#d9d5ce;
  --acc:#1f5f8b; --acc-ink:#fff; --head:#1f2a33; --head-ink:#f4f2ee;
  --rot:#c0392b; --gelb:#d4a017; --gruen:#2e8b57; --grau:#8a9299;
  --uns:#fff4cc; --uns-line:#d4a017; --field:#fbfaf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191d; --card:#1e2429; --ink:#e8e6e1; --mute:#9aa3ab; --line:#333c44;
    --acc:#5aa3d6; --acc-ink:#0d1a24; --head:#0f1316; --head-ink:#e8e6e1;
    --uns:#3a3214; --uns-line:#d4a017; --field:#181d21;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:10;background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top a{color:var(--head-ink);text-decoration:none;font-size:22px;line-height:1;padding:4px 8px 4px 0}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
label.f em{color:var(--uns-line);font-style:normal;font-weight:600}
label.f.uns input,label.f.uns select{background:var(--uns);border-color:var(--uns-line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:70px}
input[type=checkbox]{width:22px;height:22px;min-height:0}
label.cb{display:flex;align-items:center;gap:8px;font-size:15px;padding:6px 0}
.tm{display:flex;gap:6px}.tm input{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.p,.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.d{color:var(--rot);border-color:var(--rot)}
button.s{padding:4px 10px;min-height:34px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:17px;padding:14px 20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tabs a{white-space:nowrap;padding:8px 12px;border-radius:20px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;background:var(--card)}
.tabs a.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.list a.item,.list div.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list .item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--mute);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--grau)}
.dot.rot{background:var(--rot)}.dot.gelb{background:var(--gelb)}.dot.gruen{background:var(--gruen)}
.badge{font-size:12px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.badge.rot{border-color:var(--rot);color:var(--rot)}.badge.gelb{border-color:var(--gelb);color:var(--gelb)}.badge.gruen{border-color:var(--gruen);color:var(--gruen)}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
ul.chk li .dot{margin-top:4px}
.grp{margin:14px 0 4px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grp a{font-weight:400;font-size:14px;color:var(--acc)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative}
.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

.thumbs button{position:absolute;top:2px;right:2px;min-height:0;padding:0 7px;font-size:14px}
.banner{background:var(--uns);border:1px solid var(--uns-line);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
th{background:var(--bg)}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.wlist{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.wlist span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:14px}
.wlist span button{min-height:0;padding:0 4px;border:0;background:none;color:var(--rot)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sum div{background:var(--bg);border-radius:8px;padding:8px}
.sum b{display:block;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:20px;z-index:50;font-size:14px;max-width:90vw}
.doc h3{margin:14px 0 6px;font-size:15px}
.doc .kopf{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;font-size:14px}
.doc input.pl{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;min-height:30px;padding:3px 2px}
.sig{display:flex;gap:30px;margin-top:30px}.sig div{flex:1;border-top:1px solid var(--ink);padding-top:4px;font-size:12px}
.pb{page-break-before:always}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999}
  header.top,.noprint,.fab,.tabs,.toast{display:none!important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;margin:0 0 8px}
  table{font-size:10px}
  body{font-size:12px}
  @page{size:A4 landscape;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  input::placeholder,textarea::placeholder{color:transparent}
  input.leer{color:transparent}
}

<body>
<header class="top"><a id="back" href="#/" aria-label="Zurück">‹</a><h1 id="title">Betonlieferscheine</h1><a href="#/einstellungen" aria-label="Einstellungen">⚙︎</a></header>
<main id="app"></main>
<script>
"use strict";
/* ================= Hilfsfunktionen ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const fmt = (n, d = 1) => n == null ? '–' : n.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: 2});
const fdat = d => d ? d.split('-').reverse().join('.') : '–';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const toMin = t => { if (!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const diffMin = (a, b) => { const x = toMin(a), y = toMin(b); if (x == null || y == null) return null; let d = y - x; if (d < 0) d += 1440; return d; };
const norm = s => String(s || '').toUpperCase().replace(/\s+/g, '').replace(/[–—]/g, '-');
const expoSet = s => new Set(String(s || '').toUpperCase().replace(/\s+/g, '').split(/[,;/+]|(?=X)/).filter(x => /^X/.test(x)));
const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function download(name, data, type) { const b = data instanceof Blob ? data : new Blob([data], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }

/* ================= Lokale Datenbank (IndexedDB) ================= */
const STORES = ['projects', 'sorten', 'bauteile', 'ls', 'photos', 'betonagen', 'meta'];
let dbp;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('bauleiter-app', 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: 'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const st = t.objectStore(store); let out;
    const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const db = {
  all: s => tx(s, 'readonly', st => st.getAll()),
  get: (s, id) => tx(s, 'readonly', st => st.get(id)),
  put: (s, o) => tx(s, 'readwrite', st => st.put(o)),
  del: (s, id) => tx(s, 'readwrite', st => st.delete(id)),
  clear: s => tx(s, 'readwrite', st => st.clear()),
};
const S = {projects: [], sorten: [], bauteile: [], ls: [], betonagen: [], settings: {}};
async function load() {
  for (const s of ['projects', 'sorten', 'bauteile', 'ls', 'betonagen']) S[s] = await db.all(s);
  S.settings = (await db.get('meta', 'settings')) || {id: 'settings', model: 'claude-sonnet-5-5'};
}
async function saveSettings() { await db.put('meta', S.settings); }
const P = id => S.projects.find(p => p.id === id);
const sorteById = id => S.sorten.find(s => s.id === id);
const btById = id => S.bauteile.find(b => b.id === id);
const lsOf = pid => S.ls.filter(l => l.projectId === pid);
const aktiv = l => !l.zurueckgewiesen;

/* ================= Prüfregeln ================= */
const REGELN = {
  zeitMischer: 90, zeitOhne: 45, tMax: 30, tMin: 5, tMinKalt: 10, luftKalt: -3,
  quelle: 'DIN EN 13670 / DIN 1045-3, DIN 1045-2'
};
function lsWetter(l) {
  const b = S.betonagen.find(x => x.id === bKey(l.projectId, l.bauteilId, l.datum));
  const w = b?.wetter?.[l.datum]; if (!w) return null;
  const h = toMin(l.zeitEntladeBeginn || l.zeitAnkunft);
  return {min: w.min, max: w.max, stunde: h != null && w.hourly ? w.hourly[Math.floor(h / 60)] : null};
}
function pruefe(l, p) {
  const r = []; const add = (lvl, txt) => r.push({lvl, txt});
  if (l.zurueckgewiesen) { add('grau', 'Zurückgewiesen' + (l.grund ? ': ' + l.grund : '') + ' – zählt nicht zur Menge'); return r; }
  const s = sorteById(l.sorteId);
  if (l.bestaetigt === false) add('gelb', 'Importiert – noch nicht geprüft und bestätigt');
  if (!l.bauteilId) add('gelb', 'Kein Bauteil zugeordnet');
  if (l.lsSortennr && !S.sorten.some(x => x.projectId === l.projectId && sortenNrGleich(x.sortennr, l.lsSortennr))) add('rot', `Sorte ${l.lsSortennr} steht nicht im Sortenverzeichnis des Projekts – Freigabe prüfen`);
  if (!s) add('gelb', 'Keine Sorte aus dem Sortenverzeichnis zugeordnet');
  else {
    if (s.werk && l.werk && !werkPasst(s.werk, l.werk)) add('gelb', `Sorte aus dem Verzeichnis von ${s.werk}, geliefert von ${l.werk}`);
    if (l.lsFeuchte && s.feuchte && norm(l.lsFeuchte) !== norm(s.feuchte)) add('rot', `Feuchtigkeitsklasse ${l.lsFeuchte} ≠ Verzeichnis ${s.feuchte}`);
    if (s.uek && p && Number(s.uek) > Number(p.uek)) add('gelb', `Sorte ist ÜK ${s.uek}, Projekt steht auf ÜK ${p.uek}`);
    if (l.lsFestigkeit && s.festigkeit && norm(l.lsFestigkeit) !== norm(s.festigkeit)) add('rot', `Festigkeitsklasse ${l.lsFestigkeit} ≠ bestellt ${s.festigkeit}`);
    if (l.lsKonsistenz && s.konsistenz && norm(l.lsKonsistenz) !== norm(s.konsistenz)) add('rot', `Konsistenzklasse ${l.lsKonsistenz} ≠ bestellt ${s.konsistenz}`);
    if (l.lsExposition && s.exposition) { const ist = expoSet(l.lsExposition); const fehlt = [...expoSet(s.exposition)].filter(x => !ist.has(x)); if (fehlt.length) add('rot', `Expositionsklasse fehlt auf LS: ${fehlt.join(', ')}`); }
    if (l.lsSortennr && s.sortennr && !sortenNrGleich(l.lsSortennr, s.sortennr)) add('gelb', `Sortennummer ${l.lsSortennr} ≠ Verzeichnis ${s.sortennr}`);
    if (!l.lsFestigkeit && !l.lsKonsistenz && !l.lsExposition) add('gelb', 'Klassen vom Lieferschein nicht eingetragen – Sorte nicht geprüft');
  }
  if (num(l.menge) == null) add('gelb', 'Menge fehlt');
  const verl = num(l.verlaengertMin) || 0;
  const lim = (l.fahrzeugTyp === 'ohne' ? REGELN.zeitOhne : REGELN.zeitMischer) + verl;
  const ende = l.zeitEntladeEnde || null;
  const d = diffMin(l.zeitBeladung, ende);
  if (d == null) add('gelb', 'Zeiten unvollständig (Beladung Werk bis Entladeende)');
  else if (d > lim) add('rot', `${d} min von Beladung bis Entladeende – zulässig ${lim} min${verl ? ' (inkl. Verlängerung lt. LS)' : ''}`);
  else if (d > lim - 10) add('gelb', `${d} min von Beladung bis Entladeende – knapp unter ${lim} min`);
  if (l.unterschrift === 'nein') add('gelb', 'Lieferschein nicht von der Baustelle unterschrieben (Annahme nicht bestätigt)');
  const st = diffMin(l.zeitAnkunft, l.zeitEntladeBeginn);
  if (st != null && st > 30) add('gelb', `Standzeit ${st} min (Ankunft bis Entladebeginn)`);
  if (l.wasserBaustelle) add('rot', 'Wasserzugabe auf der Baustelle' + (num(l.wasserLiter) ? ` (${l.wasserLiter} l)` : '') + ' – nicht zulässig');
  if (l.fliessmittel && !l.fliessmittelVermerk) add('rot', 'Fließmittel auf der Baustelle ohne Vermerk auf dem Lieferschein');
  else if (l.fliessmittel) add('gelb', 'Fließmittel auf der Baustelle zugegeben (Vermerk vorhanden) – Mischzeit beachten');
  const t = num(l.tempFrisch); const w = lsWetter(l);
  if (t == null) { if (w && (w.min < 5 || w.max > 30)) add('gelb', `Frischbetontemperatur fehlt – bei Luft unter +5 °C bzw. über +30 °C messen`); else add('info', 'Frischbetontemperatur nicht eingetragen'); }
  else {
    if (t > REGELN.tMax) add('rot', `Frischbeton ${fmt(t)} °C > ${REGELN.tMax} °C`);
    if (t < REGELN.tMin) add('rot', `Frischbeton ${fmt(t)} °C < ${REGELN.tMin} °C`);
    else if (w && w.min != null && w.min < REGELN.luftKalt && t < REGELN.tMinKalt) add('rot', `Luft unter ${REGELN.luftKalt} °C: Frischbeton mind. ${REGELN.tMinKalt} °C nötig`);
    else if (w && w.min != null && w.min < 5 && t < REGELN.tMinKalt) add('gelb', `Luft unter +5 °C: bei Zement < 240 kg/m³ oder LH-Zement mind. ${REGELN.tMinKalt} °C nötig`);
  }
  if (p?.lieferadresse && l.lsAdresse) { const a = norm(p.lieferadresse).replace(/[^A-Z0-9]/g, ''), b = norm(l.lsAdresse).replace(/[^A-Z0-9]/g, ''); if (a && b && !a.includes(b) && !b.includes(a)) add('gelb', 'Lieferadresse weicht von der Projektadresse ab'); }
  if (l.unsicher?.length) add('gelb', `${l.unsicher.length} Feld(er) von KI unsicher gelesen – bitte prüfen`);
  if (!r.some(x => x.lvl !== 'info')) add('gruen', 'Alle Prüfungen ohne Befund');
  return r;
}
function sortenNrGleich(a, b) { const f = x => norm(x).replace(/\(?JBL\)?$/, '').replace(/[^A-Z0-9]/g, ''); return !!a && !!b && f(a) === f(b); }
function werkPasst(sw, lw) { const w = String(lw).toLowerCase(); return String(sw).toLowerCase().split(/[^a-zäöüß0-9]+/).filter(x => x.length >= 4 && !['beton', 'werk', 'gmbh'].includes(x)).some(x => w.includes(x)); }
function findeSorte(pid, l) {
  const ss = S.sorten.filter(x => x.projectId === pid);
  let c = l.lsSortennr ? ss.filter(x => sortenNrGleich(x.sortennr, l.lsSortennr)) : [];
  if (c.length > 1 && l.werk) { const w = c.filter(x => werkPasst(x.werk, l.werk)); if (w.length) c = w; }
  if (!c.length && l.lsFestigkeit) c = ss.filter(x => norm(x.festigkeit) === norm(l.lsFestigkeit) && norm(x.konsistenz) === norm(l.lsKonsistenz) && [...expoSet(x.exposition)].every(e => expoSet(l.lsExposition).has(e)) && (!l.werk || !x.werk || werkPasst(x.werk, l.werk)));
  return c.length === 1 ? c[0].id : '';
}
const sorteLabel = s => s ? `${s.bez || s.sortennr}${s.werk ? ' · ' + s.werk : ''}` : '';
const ampel = r => r.some(x => x.lvl === 'rot') ? 'rot' : r.some(x => x.lvl === 'gelb') ? 'gelb' : r.some(x => x.lvl === 'grau') ? 'grau' : 'gruen';
const chkHtml = r => `<ul class="chk">${r.map(x => `<li><span class="dot ${x.lvl}"></span><span>${esc(x.txt)}</span></li>`).join('')}</ul>`;

/* ================= Würfel ================= */
const WREGEL = {
  neu: '1 Probekörper je 100 m³, mind. 1 je Betoniertag (MPA BAU Leitfaden ÜK 2, 04/2026)',
  alt: '3 Proben je 300 m³ oder je 3 Betoniertage, die größere Zahl (DIN 1045-3, ÜK 2)',
  eigen: 'Eigene Regel (Vertrag/LV)'
};
function wuerfelSoll(p, list) {
  const a = list.filter(aktiv); const total = a.reduce((s, l) => s + (num(l.menge) || 0), 0); const tage = new Set(a.map(l => l.datum)).size;
  if (!a.length) return 0;
  if (p.uek === '1') return 0;
  if (p.wRegel === 'alt') return Math.max(3 * Math.ceil(total / 300), 3 * Math.ceil(tage / 3));
  if (p.wRegel === 'eigen') { const m = num(p.wM3) || 100, t = num(p.wTag) || 0; return Math.max(Math.ceil(total / m), tage * t); }
  return Math.max(Math.ceil(total / 100), tage);
}
const wuerfelIst = list => list.reduce((s, l) => s + (l.wuerfel?.length || 0), 0);

/* ================= Wetter (Open-Meteo, ohne Schlüssel) ================= */
async function geocode(name) {
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=de&name=' + encodeURIComponent(name));
  const j = await r.json(); return j.results || [];
}
async function holeWetter(p, von, bis) {
  if (p.lat == null) throw new Error('Für das Projekt ist kein Ort mit Koordinaten hinterlegt');
  const alt = (new Date() - new Date(von + 'T00:00')) / 864e5 > 60;
  const base = alt ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';

function verkleinere(file, maxKante = 2000, q = 0.75) {
  if (file.type === 'application/pdf') return file.size > 20 * 1048576 ? Promise.reject(new Error('PDF größer als 20 MB')) : Promise.resolve(file);
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const f = Math.min(1, maxKante / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht verarbeitet werden')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;
  });
}
const blobToB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(b); });

const KI_FELDER = {
  lsNr: 'Lieferscheinnummer (LS-Nr.)', datum: 'Lieferdatum im Format JJJJ-MM-TT', werk: 'Lieferwerk (Firma + Werksort, z. B. "GROSS-th-beton Saarlouis", "Mobil-Beton Rehlingen", "Dyckerhoff Dillingen")',

  menge: 'Menge dieses Fahrzeugs in m³ (nicht kumuliert)', bestellmengeLS: 'Bestellmenge bzw. Soll in m³', mengeKum: 'bisher geliefert bzw. Ist in m³ (kumuliert, inkl. dieses Fahrzeugs)', restLS: 'Rest in m³',
  zeitBeladung: 'Beladezeit im Werk / Uhrzeit Beladung / Beladung im Werk, HH:MM', zeitAnkunft: 'Ankunft Baustelle, HH:MM', zeitEntladeBeginn: 'Entladebeginn, HH:MM', zeitEntladeEnde: 'Entladeende, HH:MM',
  verlaengertMin: 'Verlängerung der Verarbeitbarkeitszeit in Minuten, falls angegeben (z. B. "verlängert um 02:00" = 120)',
  wasserLiter: 'auf der Baustelle zugegebenes Wasser in Litern (Feld "Wasserzugabe … l/Fahrzeug" o. ä.)', fliessmittel: 'nachträgliche Zugabe von Fließmittel/Verzögerer auf der Baustelle vermerkt (true/false)',
  tempFrisch: 'Frischbetontemperatur in °C, falls eingetragen (nicht die Lufttemperatur des Werks)', unterschrift: 'Unterschrift des Abnehmers/der Baustelle vorhanden ("ja"/"nein"); "nein" auch bei Vermerk wie "Ohne Unterschrift"',
  lsAdresse: 'Baustellen-/Lieferadresse'
};
async function kiAuslesen(blobs) {
  const key = S.settings.apiKey; if (!key) throw new Error('Kein API-Schlüssel hinterlegt (Einstellungen)');
  const felder = Object.entries(KI_FELDER).map(([k, v]) => `"${k}": ${v}`).join('\n');
  const text = `Du liest deutsche Betonlieferscheine (Transportbeton) aus. Die Dateien können einen oder mehrere Lieferscheine enthalten; bei PDFs ist meist jede Seite ein eigener Lieferschein. Mehrere Fotos derselben LS-Nr. gehören zu einem Lieferschein.
Gib NUR JSON zurück, ohne weiteren Text: {"lieferscheine": [ {Felder…}, … ]}
Für jedes Feld: {"wert": ..., "sicher": true|false}.
Regeln:
- Nichts raten. Fehlt ein Feld oder ist es unleserlich: {"wert": null, "sicher": false}.
- "sicher": false bei Handschrift, Verdeckung, Unschärfe oder Mehrdeutigkeit.
- Zahlen mit Punkt als Dezimaltrenner. Uhrzeiten als "HH:MM".
- Zusätzlich je Lieferschein "hinweise": kurzer Text zu Auffälligkeiten (handschriftliche Vermerke wörtlich, fehlende Unterschrift, Wasser-/Fließmittelvermerk), sonst null.
Felder:
${felder}`;
  const content = [];
  for (const b of blobs) {
    const data = await blobToB64(b);
    if (b.type === 'application/pdf') content.push({type: 'document', source: {type: 'base64', media_type: 'application/pdf', data}});

  }
  content.push({type: 'text', text});
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: S.settings.model || 'claude-sonnet-5-5', max_tokens: 8000, messages: [{role: 'user', content}]})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j?.error?.message || ('API-Fehler ' + r.status));
  const out = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const m = out.match(/\{[\s\S]*\}/); if (!m) throw new Error('Antwort der KI war kein JSON');

}

function kiUebernehmen(F, j) {
  let n = 0; F.unsicher = F.unsicher || [];
  for (const k of Object.keys(KI_FELDER)) { const v = j[k]; if (!v || v.wert == null || v.wert === '') continue;
    if (k === 'wasserLiter') { if (num(v.wert)) { F.wasserBaustelle = true; F.wasserLiter = String(v.wert); } else continue; }
    else if (k === 'fliessmittel') { F.fliessmittel = v.wert === true || v.wert === 'true'; if (F.fliessmittel) F.fliessmittelVermerk = true; }
    else if (k === 'unterschrift') { const w = String(v.wert).toLowerCase(); F.unterschrift = (w === 'ja' || w === 'true') ? 'ja' : (w === 'nein' || w === 'false') ? 'nein' : ''; }
    else F[k] = String(v.wert);
    n++; if (v.sicher === false && !F.unsicher.includes(k)) F.unsicher.push(k); }

  return n;
}

/* ---- ÜK 2/3 Checkliste ---- */
function uekHtml(p, L) {
  const c = p.checklist || {}; const tage = [...new Set(L.filter(aktiv).map(l => l.datum))].sort();
  const items = [];
  const it = (lvl, txt) => items.push({lvl, txt});
  it(c.pruefstelle ? 'gruen' : 'rot', 'Ständige Betonprüfstelle (Eigenüberwachung): ' + (c.pruefstelle || 'nicht eingetragen'));
  it(c.ueberwachung ? 'gruen' : 'rot', 'Anerkannte Überwachungsstelle (Fremdüberwachung): ' + (c.ueberwachung || 'nicht eingetragen'));
  it(c.unabhaengig ? 'gruen' : 'gelb', c.unabhaengig ? 'Bestätigt: Prüfstelle überwacht nicht auch das Betonwerk' : 'Bestätigen: Prüfstelle überwacht nicht auch das Betonwerk');
  if (!c.anmeldung) it('rot', 'Baustellenanmeldung: Datum fehlt (schriftlich vor Beginn der Betonarbeiten)');
  else if (tage.length && c.anmeldung > tage[0]) it('rot', `Anmeldung ${fdat(c.anmeldung)} liegt nach der ersten Betonage ${fdat(tage[0])}`);
  else it('gruen', 'Baustelle angemeldet am ' + fdat(c.anmeldung));
  it(c.schild ? 'gruen' : 'rot', c.schild ? 'Baustellenschild mit DIN EN 13670 / DIN 1045-3 und Überwachungsstelle angebracht' : 'Baustellenschild (DIN EN 13670 / DIN 1045-3, Überwachungsstelle) nicht bestätigt');
  const sch = c.schulungen || [];
  if (!sch.length) it('gelb', 'Keine Schulungsnachweise eingetragen (spätestens alle 3 Jahre)');
  for (const s of sch) { const ab = addDays(s.datum, 3 * 365); const lvl = ab < today() ? 'rot' : ab < addDays(today(), 90) ? 'gelb' : 'gruen'; it(lvl, `Schulung ${s.name}: ${fdat(s.datum)} – gültig bis ${fdat(ab)}`); }
  for (let i = 1; i < tage.length; i++) { const g = (new Date(tage[i]) - new Date(tage[i - 1])) / 864e5; if (g > 28) it('gelb', `Unterbrechung ${Math.round(g)} Tage (${fdat(tage[i - 1])} – ${fdat(tage[i])}): Meldung an Überwachungsstelle prüfen`); }
  it('grau', 'Meldepflicht bei Wechsel von Bauleiter oder Prüfstellenleiter beachten');
  it(c.abmeldung ? 'gruen' : 'grau', c.abmeldung ? 'Abgemeldet am ' + fdat(c.abmeldung) : 'Abmeldung nach Abschluss: Akte mit Betoniertagebuch und Lieferverzeichnis an die Überwachungsstelle');
  return `<div class="card"><h2>Status ÜK ${esc(p.uek)}</h2>${chkHtml(items)}</div>
  <form id="uf" class="card"><h2>Angaben</h2><div class="grid">
    <label class="f"><span>Ständige Betonprüfstelle</span><input name="pruefstelle" value="${esc(c.pruefstelle)}"></label>
    <label class="f"><span>Überwachungsstelle</span><input name="ueberwachung" value="${esc(c.ueberwachung)}"></label>
    <label class="f"><span>Baustellenanmeldung am</span><input type="date" name="anmeldung" value="${esc(c.anmeldung)}"></label>
    <label class="f"><span>Abmeldung am</span><input type="date" name="abmeldung" value="${esc(c.abmeldung)}"></label></div>
    <label class="cb"><input type="checkbox" name="unabhaengig" ${c.unabhaengig ? 'checked' : ''}> Prüfstelle überwacht nicht das Betonwerk</label>
    <label class="cb"><input type="checkbox" name="schild" ${c.schild ? 'checked' : ''}> Baustellenschild angebracht</label>
    <h2 style="margin-top:10px">Schulungen</h2><div id="sch">${sch.map((s, i) => `<div class="row" style="margin:4px 0"><span style="flex:1">${esc(s.name)} · ${fdat(s.datum)}</span><button type="button" class="s d" data-del="${i}">×</button></div>`).join('')}</div>
    <div class="row"><input name="sname" placeholder="Name" style="flex:2"><input type="date" name="sdatum" style="flex:1"><button type="button" class="s" id="addSch">+</button></div>
    <p><button class="p" type="submit">Speichern</button></p></form>
  <p class="mute">Grundlage: DIN 1045-3, Anhänge zur Überwachung; Leitfäden der Überwachungsstellen. Ersetzt nicht die Vorgaben eurer Überwachungsstelle.</p>`;
}
function bindUek(app, p) {
  const f = $('#uf'); if (!f) return;
  const save = async () => { const fd = new FormData(f); p.checklist = {...(p.checklist || {}), pruefstelle: fd.get('pruefstelle'), ueberwachung: fd.get('ueberwachung'), anmeldung: fd.get('anmeldung'), abmeldung: fd.get('abmeldung'), unabhaengig: !!fd.get('unabhaengig'), schild: !!fd.get('schild')}; await db.put('projects', p); await load(); };
  f.onsubmit = async e => { e.preventDefault(); await save(); toast('Gespeichert'); render(); };
  $('#addSch').onclick = async () => { const n = f.sname.value.trim(), d = f.sdatum.value; if (!n || !d) return toast('Name und Datum eingeben'); await save(); p.checklist.schulungen = [...(p.checklist.schulungen || []), {name: n, datum: d}]; await db.put('projects', p); await load(); render(); };
  f.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await save(); p.checklist.schulungen.splice(+b.dataset.del, 1); await db.put('projects', p); await load(); render(); });
}

const SORTE_FELDER = [['bez', 'Bezeichnung (Kurzform)'], ['werk', 'Lieferwerk'], ['sortennr', 'Sortennr. / Artikel / Abrufnr.'], ['rezeptNr', 'Rezept-Nr.'], ['festigkeit', 'Festigkeitsklasse'], ['exposition', 'Expositionsklassen'], ['konsistenz', 'Konsistenzklasse'], ['groesstkorn', 'Größtkorn (mm)'], ['feuchte', 'Feuchtigkeitsklasse'], ['fe', 'Festigkeitsentwicklung'], ['pruefalter', 'Prüfalter (Tage)'], ['uek', 'Überwachungsklasse'], ['chlorid', 'Chloridklasse'], ['zement', 'Zement'], ['wz', 'w/z'], ['bestellt', 'Bestellte Menge (m³)']];
function viewSorte(app, p, sid) {
  const n = sid === 'neu'; const s = n ? {} : sorteById(sid); if (!s) return location.hash = `#/p/${p.id}/tab/sorten`;

  <form id="sf" class="card"><div class="grid">${SORTE_FELDER.map(([k, t]) => `<label class="f"><span>${t}${k === 'bez' ? ' *' : ''}</span><input name="${k}" ${k === 'bez' ? 'required' : ''} ${k === 'bestellt' ? 'inputmode="decimal"' : ''} value="${esc(s[k])}"></label>`).join('')}</div>
    <label class="f" style="margin-top:8px"><span>Besondere Eigenschaften / Bemerkung (z. B. WU, PA 56 d, Massige Bauteile)</span><textarea name="bemerkung">${esc(s.bemerkung)}</textarea></label>
    ${s.quelle ? `<p class="mute">Quelle: ${esc(s.quelle)}</p>` : ''}
    <div class="row" style="margin-top:8px"><button class="p">Speichern</button>${n ? '' : '<button type="button" class="d" id="del">Löschen</button>'}</div></form>`;
  $('#sf').onsubmit = async e => { e.preventDefault(); const o = {...s, ...Object.fromEntries(new FormData(e.target)), id: s.id || uid(), projectId: p.id}; await db.put('sorten', o); await load(); location.hash = `#/p/${p.id}/tab/sorten`; };
  const d = $('#del'); if (d) d.onclick = async () => { if (lsOf(p.id).some(l => l.sorteId === s.id)) return toast('Sorte wird von Lieferscheinen genutzt'); if (!confirm('Sorte löschen?')) return; await db.del('sorten', s.id); await load(); location.hash = `#/p/${p.id}/tab/sorten`; };
}
async function importSorten(p, file) {
  const j = JSON.parse(await file.text());
  const liste = j.sorten || (Array.isArray(j) ? j : null); if (!liste) throw new Error('Keine Sortenliste in der Datei');
  let neu = 0, gleich = 0;
  for (const x of liste) {
    const da = S.sorten.find(y => y.projectId === p.id && sortenNrGleich(y.sortennr, x.sortennr) && (y.werk || '') === (x.werk || ''));
    if (da) { gleich++; continue; }
    await db.put('sorten', {...x, id: uid(), projectId: p.id}); neu++;
  }
  await load(); return {neu, gleich};
}

  let kum = 0; const sorten = [...new Set(akt.map(l => l.sorteId))].map(sorteById).filter(Boolean);

      <div><b>Luft-Temperatur:</b> ${w ? `min ${fmt(w.min)} °C / max ${fmt(w.max)} °C` : '–'} ${editable ? '<button class="s noprint" data-act="wetter">Wetter laden</button>' : ''}</div><div><b>Witterung:</b> ${inp('witterung', 'z. B. sonnig, windig')}</div></div>
    <h3>Betonsorten</h3><p style="margin:0">${sorten.map(s => esc(`${s.bez}: ${s.festigkeit || ''} ${s.exposition || ''} ${s.konsistenz || ''}${s.groesstkorn ? ' GK ' + s.groesstkorn : ''}${s.werk ? ' – ' + s.werk : ''}`)).join('<br>') || '–'}</p>

  app.innerHTML = `<div class="row noprint" style="margin-bottom:10px"><button class="p" onclick="window.print()">Drucken / PDF</button></div>
  <div class="card doc"><h2 style="font-size:18px;text-transform:none;color:var(--ink)">${esc(p.name)} – Betonage-Dokumentation</h2><p>Stand ${fdat(today())} · ÜK ${esc(p.uek)} · Prüfstelle: ${esc(p.checklist?.pruefstelle || '–')} · Überwachungsstelle: ${esc(p.checklist?.ueberwachung || '–')}</p>
  <h3>Verwendete Betonsorten</h3><table><tr><th>Bezeichnung</th><th>Sortennr.</th><th>Festigkeit</th><th>Exposition</th><th>Konsistenz</th><th>GK</th><th>Werk</th><th class="n">bestellt m³</th><th class="n">geliefert m³</th></tr>${ss.filter(s => num(s.bestellt) || L.some(l => l.sorteId === s.id)).map(s => `<tr><td>${esc(s.bez)}</td><td>${esc(s.sortennr || '')}</td><td>${esc(s.festigkeit || '')}</td><td>${esc(s.exposition || '')}</td><td>${esc(s.konsistenz || '')}</td><td>${esc(s.groesstkorn || '')}</td><td>${esc(s.werk || '')}</td><td class="n">${fmt(num(s.bestellt))}</td><td class="n">${fmt(L.filter(l => l.sorteId === s.id && aktiv(l)).reduce((a, l) => a + (num(l.menge) || 0), 0))}</td></tr>`).join('')}</table>
  <h3>Lieferverzeichnis</h3><div class="scroll"><table><tr><th>Datum</th><th>Bauteil</th><th>LS-Nr.</th><th>Werk</th><th>Sorte</th><th class="n">m³</th><th>Entladen</th><th class="n">FB °C</th><th>Würfel</th><th>Status</th></tr>${L.map(l => `<tr><td>${fdat(l.datum)}</td><td>${esc(btById(l.bauteilId)?.name || '')}</td><td>${esc(l.lsNr || '')}</td><td>${esc(l.werk || '')}</td><td>${esc(sorteById(l.sorteId)?.bez || '')}</td><td class="n">${fmt(num(l.menge))}</td><td>${esc((l.zeitEntladeBeginn || '') + '–' + (l.zeitEntladeEnde || ''))}</td><td class="n">${esc(l.tempFrisch || '')}</td><td>${esc((l.wuerfel || []).map(x => x.nr).join(', '))}</td><td>${l.zurueckgewiesen ? 'zurückgewiesen' : ampel(pruefe(l, p))}</td></tr>`).join('')}</table></div>
  <h3>Würfelliste</h3><table><tr><th>Nr.</th><th>Datum</th><th>Bauteil</th><th>LS-Nr.</th><th>Sorte</th><th class="n">PA</th><th class="n">f 7 d</th><th class="n">f 28 d</th><th class="n">f 56 d</th></tr>${W.map(({w, l}) => `<tr><td>${esc(w.nr)}</td><td>${fdat(l.datum)}</td><td>${esc(btById(l.bauteilId)?.name || '')}</td><td>${esc(l.lsNr || '')}</td><td>${esc(sorteById(l.sorteId)?.bez || '')}</td><td class="n">${esc(sorteById(l.sorteId)?.pruefalter || '')}</td><td class="n">${esc(w.f7 || '')}</td><td class="n">${esc(w.f28 || '')}</td><td class="n">${esc(w.f56 || '')}</td></tr>`).join('')}</table></div>${prots}`;
}

/* ---- CSV-Export ---- */
const csvCell = v => { const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
const fname = (p, t) => `${today()}_${p.name.replace(/[^\wäöüÄÖÜß-]+/g, '_')}_${t}.csv`;
function exportLS(p) {
  const rows = [['Datum', 'Bauteil', 'Achsen', 'LS-Nr', 'Werk', 'Fahrzeug', 'Sorte', 'Festigkeit LS', 'Exposition LS', 'Konsistenz LS', 'Menge m3', 'Beladung', 'Abfahrt', 'Ankunft', 'Entladebeginn', 'Entladeende', 'Werk bis Ende min', 'Verlaengert min', 'Unterschrift Baustelle', 'Frischbeton C', 'Ausbreitmass mm', 'Wasser Baustelle l', 'Fliessmittel', 'Wuerfel', 'Zurueckgewiesen', 'Grund', 'Ampel', 'Befunde', 'Bemerkung']];
  for (const l of lsOf(p.id).sort((a, b) => (a.datum + (a.zeitEntladeBeginn || '')).localeCompare(b.datum + (b.zeitEntladeBeginn || '')))) { const r = pruefe(l, p); const bt = btById(l.bauteilId);
    rows.push([fdat(l.datum), bt?.name, bt?.achsen, l.lsNr, l.werk, l.fahrzeug, sorteById(l.sorteId)?.bez, l.lsFestigkeit, l.lsExposition, l.lsKonsistenz, num(l.menge), l.zeitBeladung, l.zeitAbfahrt, l.zeitAnkunft, l.zeitEntladeBeginn, l.zeitEntladeEnde, diffMin(l.zeitBeladung, l.zeitEntladeEnde), num(l.verlaengertMin), l.unterschrift, num(l.tempFrisch), l.konsistenzMess, l.wasserBaustelle ? num(l.wasserLiter) ?? 'ja' : '', l.fliessmittel ? 'ja' : '', (l.wuerfel || []).map(w => w.nr).join(', '), l.zurueckgewiesen ? 'ja' : '', l.grund, ampel(r), r.filter(x => x.lvl !== 'gruen').map(x => x.txt).join(' | '), l.bemerkung]); }
  download(fname(p, 'Lieferscheine'), csv(rows), 'text/csv;charset=utf-8');
}
function exportW(p) { const rows = [['Wuerfel-Nr', 'Datum', 'Uhrzeit', 'Bauteil', 'LS-Nr', 'Sorte', 'Festigkeit', 'Pruefalter d', 'f 7d N/mm2', 'f 28d N/mm2', 'f 56d N/mm2']]; for (const l of lsOf(p.id)) for (const w of l.wuerfel || []) rows.push([w.nr, fdat(l.datum), w.zeit, btById(l.bauteilId)?.name, l.lsNr, sorteById(l.sorteId)?.bez, sorteById(l.sorteId)?.festigkeit, sorteById(l.sorteId)?.pruefalter, num(w.f7), num(w.f28), num(w.f56)]); rows.splice(1, rows.length, ...rows.slice(1).sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'de', {numeric: true}))); download(fname(p, 'Wuerfel'), csv(rows), 'text/csv;charset=utf-8'); }
function exportBT(p) { const rows = [['Bauteil', 'Achsen', 'Soll m3', 'Geliefert m3', 'Differenz m3', 'Betoniertage', 'Lieferscheine', 'Wuerfel']]; for (const b of S.bauteile.filter(x => x.projectId === p.id)) { const g = lsOf(p.id).filter(l => l.bauteilId === b.id && aktiv(l)); const m = g.reduce((s, l) => s + (num(l.menge) || 0), 0); rows.push([b.name, b.achsen, num(b.soll), m, num(b.soll) != null ? +(m - num(b.soll)).toFixed(2) : '', [...new Set(g.map(l => fdat(l.datum)))].join(', '), g.length, wuerfelIst(g)]); } download(fname(p, 'Mengen_Bauteile'), csv(rows), 'text/csv;charset=utf-8'); }
function exportS(p) { const rows = [['Sorte', 'Sortennr', 'Festigkeit', 'Exposition', 'Konsistenz', 'Werk', 'Bestellt m3', 'Geliefert m3', 'Rest m3', 'Wuerfel Soll', 'Wuerfel Ist']]; for (const s of S.sorten.filter(x => x.projectId === p.id)) { const g = lsOf(p.id).filter(l => l.sorteId === s.id && aktiv(l)); const m = g.reduce((a, l) => a + (num(l.menge) || 0), 0); rows.push([s.bez, s.sortennr, s.festigkeit, s.exposition, s.konsistenz, s.werk, num(s.bestellt), m, num(s.bestellt) != null ? +(num(s.bestellt) - m).toFixed(2) : '', wuerfelSoll(p, g), wuerfelIst(g)]); } download(fname(p, 'Mengen_Sorten'), csv(rows), 'text/csv;charset=utf-8'); }

/* ---- Einstellungen & Sicherung ---- */
async function viewSettings(app) {
  setHead('Einstellungen', '#/');
  const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
  const pers = navigator.storage?.persisted ? await navigator.storage.persisted() : null;
  app.innerHTML = `<div class="card"><h2>Sicherung</h2><p>Alle Daten liegen nur auf diesem Gerät. Bitte regelmäßig sichern und die Datei z. B. in OneDrive oder per Mail ablegen.</p>
    <p class="mute">Letzte Sicherung: ${S.settings.lastBackup ? new Date(S.settings.lastBackup).toLocaleString('de-DE') : 'noch nie'}${est ? ` · belegt ca. ${fmt(est.usage / 1048576)} MB` : ''}${pers === false ? ' · Speicher nicht dauerhaft geschützt – App über „Zum Home-Bildschirm“ öffnen' : ''}</p>
    <div class="row"><button class="p" id="bk">Sicherung herunterladen</button><label class="btn"><input type="file" accept="application/json,.json" id="rs" hidden>Sicherung einspielen</label></div></div>
  <div class="card"><h2>KI-Auslesen (optional)</h2><p class="mute">Eigener Schlüssel aus der Anthropic Console. Er wird nur auf diesem Gerät gespeichert. In der Console ein monatliches Ausgabenlimit setzen.</p>
    <label class="f"><span>API-Schlüssel</span><input type="password" id="key" value="${esc(S.settings.apiKey)}" placeholder="sk-ant-…" autocomplete="off"></label>
    <label class="f" style="margin-top:8px"><span>Modell</span><select id="model"><option value="claude-sonnet-5-5" ${S.settings.model !== 'claude-haiku-4-5-20251001' ? 'selected' : ''}>Claude Sonnet 5.5 (genauer)</option><option value="claude-haiku-4-5-20251001" ${S.settings.model === 'claude-haiku-4-5-20251001' ? 'selected' : ''}>Claude Haiku 4.5 (günstiger)</option></select></label>
    <div class="row" style="margin-top:8px"><button class="p" id="ks">Speichern</button><button id="kd">Schlüssel löschen</button></div></div>
  <div class="card"><h2>Prüfregeln</h2><ul class="chk">
    <li>Fahrmischer/Rührwerk: Entladeende spätestens ${REGELN.zeitMischer} min nach Beladung (1. Wasserzugabe); ohne Rührwerk ${REGELN.zeitOhne} min</li>
    <li>Wasserzugabe auf der Baustelle: nicht zulässig (rot)</li><li>Fließmittel auf der Baustelle: nur mit Vermerk auf dem Lieferschein</li>
    <li>Frischbeton max. +${REGELN.tMax} °C, min. +${REGELN.tMin} °C; bei Luft unter ${REGELN.luftKalt} °C min. +${REGELN.tMinKalt} °C</li>
    <li>Festigkeits-, Konsistenz- und Expositionsklassen lt. Lieferschein gegen Sortenverzeichnis</li></ul><p class="mute">Quelle: ${esc(REGELN.quelle)}. Vertragliche Regelungen können strenger sein.</p></div>`;
  $('#ks').onclick = async () => { S.settings.apiKey = $('#key').value.trim(); S.settings.model = $('#model').value; await saveSettings(); toast('Gespeichert'); };
  $('#kd').onclick = async () => { delete S.settings.apiKey; await saveSettings(); render(); };
  $('#bk').onclick = async () => {
    const out = {app: 'bauleiter-app', version: 1, stand: new Date().toISOString(), data: {}};
    for (const s of ['projects', 'sorten', 'bauteile', 'ls', 'betonagen']) out.data[s] = await db.all(s);
    out.data.photos = []; for (const ph of await db.all('photos')) out.data.photos.push({id: ph.id, b64: await blobToB64(ph.blob)});
    download(`${today()}_Sicherung_Betonlieferscheine.json`, JSON.stringify(out), 'application/json');
    S.settings.lastBackup = Date.now(); await saveSettings(); toast('Sicherung erstellt'); render();
  };
  $('#rs').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.app !== 'bauleiter-app') throw new Error('Keine Sicherung dieser App');
      if (!confirm('Sicherung einspielen? Vorhandene Einträge mit gleicher Kennung werden überschrieben, andere bleiben erhalten.')) return;
      for (const s of ['projects', 'sorten', 'bauteile', 'ls', 'betonagen']) for (const o of j.data[s] || []) await db.put(s, o);
      for (const ph of j.data.photos || []) await db.put('photos', {id: ph.id, blob: b64ToBlob(ph.b64)});
      await load(); toast('Sicherung eingespielt'); location.hash = '#/';
    } catch (err) { toast('Fehler: ' + err.message); }
  };
}

/* ================= Start ================= */
(async () => {
  await load();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
})();
</script>
